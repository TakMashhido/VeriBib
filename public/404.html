<!doctype html>
<html lang="en">

    :root { --bg:#eef0fb; --surface:#f8f9ff; --ink:#1d2146; --muted:#5d648e; --p1:#6366f1; --p2:#8b5cf6;
      --clay: 18px 22px 44px rgba(84,92,170,.17), -12px -12px 32px rgba(255,255,255,.9), inset 4px 4px 10px rgba(255,255,255,.95), inset -6px -6px 14px rgba(90,98,170,.1); }

    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; box-sizing:border-box; background:var(--bg); color:var(--ink); font-family:"Nunito",ui-rounded,system-ui,sans-serif; }

    a { display:inline-block; margin-top:12px; padding:14px 24px; border-radius:18px; color:#fff; font-weight:800; text-decoration:none; background:linear-gradient(135deg,var(--p1),var(--p2)); box-shadow:8px 12px 24px rgba(99,102,241,.35), inset 3px 3px 6px rgba(255,255,255,.4); }
